version: '3.8'

services:
  valkey:
    image: valkey/valkey:latest
    container_name: valkey_so1
    ports:
      - "6379:6379"
    networks:
      - so1_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_so1
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    networks:
      - so1_network
    restart: unless-stopped
    depends_on:
      - valkey

networks:
  so1_network:
    driver: bridge