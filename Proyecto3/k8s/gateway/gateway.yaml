apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: gke-l7-global-external-managed
spec:
  controllerName: networking.gke.io/gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mumnk8s-gateway
  namespace: mumnk8s
  annotations:
    networking.gke.io/certmap: ""
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mumnk8s-route
  namespace: mumnk8s
spec:
  parentRefs:
  - name: mumnk8s-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /grpc-202202768
    backendRefs:
    - name: rust-api
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /health
    backendRefs:
    - name: rust-api
      port: 8080